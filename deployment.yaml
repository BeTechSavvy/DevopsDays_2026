apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
      - name: flask-container

        image: flask-demo

        imagePullPolicy: Never

        ports:
        - name: http
          containerPort: 5000

        # Resource limits are required for cpu_percent / memory_percent to
        # mean anything -- Prometheus can only report raw usage without them.
        # prometheus_source.py divides usage by these limits to get a real %.
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"