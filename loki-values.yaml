loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  # pinned to node 1, away from the node-pressure scenario on node 2
  nodeSelector:
    kubernetes.io/hostname: minikube

gateway:
  nodeSelector:
    kubernetes.io/hostname: minikube

# The chart's memcached caches request ~8 GB by default -- far more than a
# laptop minikube node has, so they'd sit Pending forever. Not needed here.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

deploymentMode: SingleBinary

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0