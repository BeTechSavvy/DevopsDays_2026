# kube-prometheus-stack uses the Prometheus Operator, which does NOT scrape
# services automatically from prometheus.io/scrape annotations -- it only
# scrapes what's described by a ServiceMonitor CRD.
#
# By default the chart's Prometheus CR only picks up ServiceMonitors that
# carry the label `release: <helm release name>`. The README installs with
# `helm install prometheus prometheus-community/kube-prometheus-stack`, so
# the release name is "prometheus" -- hence the label below. If your release
# name differs, change it to match, or this ServiceMonitor will be silently
# ignored.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-service-monitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: flask
  endpoints:
    - port: http
      path: /metrics
      interval: 15s